<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>WAWA 학습 사이트 QR — 인쇄용</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
  :root {
    --ink: #000;
    --line: #000;
    --mute: #555;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #d9d9d9;
    font-family: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: var(--ink);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* A4: 210mm x 297mm. 인쇄 안전 여백 12mm */
  .page {
    width: 210mm;
    height: 297mm;
    margin: 16px auto;
    padding: 18mm 16mm;
    background: #fff;
    position: relative;
    box-shadow: 0 2px 12px rgba(0,0,0,.15);
    display: flex;
    flex-direction: column;
  }

  .brand {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 2px solid var(--line);
    padding-bottom: 6mm;
  }
  .brand .logo {
    font-size: 28pt;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .brand .logo .dot {
    display: inline-block;
    width: 12pt;
    height: 12pt;
    background: var(--ink);
    margin-right: 6pt;
    transform: translateY(1pt);
  }
  .brand .tag {
    font-size: 10pt;
    color: var(--mute);
    letter-spacing: 0.2em;
  }

  .headline {
    margin: 10mm 0 4mm;
    text-align: center;
  }
  .headline h1 {
    margin: 0 0 4mm;
    font-size: 34pt;
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1.1;
  }
  .headline h1 em {
    font-style: normal;
    background: var(--ink);
    color: #fff;
    padding: 0 10pt;
  }
  .headline p {
    margin: 0;
    font-size: 13pt;
    color: var(--mute);
  }

  /* QR 박스 — 가운데 큰 1개 */
  .qr-card {
    flex: 1;
    margin: 6mm auto 0;
    width: 130mm;
    border: 3px solid var(--line);
    padding: 8mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  .qr-card::before,
  .qr-card::after {
    content: "";
    position: absolute;
    width: 16mm;
    height: 16mm;
    border: 3px solid var(--line);
  }
  .qr-card::before { top: -3mm; left: -3mm; border-right: 0; border-bottom: 0; background: #fff; }
  .qr-card::after  { bottom: -3mm; right: -3mm; border-left: 0; border-top: 0; background: #fff; }

  .qr-wrap {
    width: 110mm;
    height: 110mm;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
  }
  .qr-wrap canvas,
  .qr-wrap img {
    width: 100% !important;
    height: 100% !important;
    image-rendering: pixelated;
  }

  .url-box {
    margin-top: 6mm;
    padding: 4mm 6mm;
    border: 2px dashed var(--line);
    font-family: "Menlo", "Consolas", monospace;
    font-size: 14pt;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  /* 안내 — 3 step */
  .steps {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4mm;
    margin-top: 8mm;
  }
  .step {
    border: 2px solid var(--line);
    padding: 4mm;
    text-align: center;
  }
  .step .num {
    display: inline-flex;
    width: 9mm;
    height: 9mm;
    align-items: center;
    justify-content: center;
    font-size: 14pt;
    font-weight: 900;
    border: 2px solid var(--line);
    border-radius: 50%;
    margin-bottom: 2mm;
  }
  .step .t {
    font-size: 11pt;
    font-weight: 700;
    margin: 0 0 1mm;
  }
  .step .d {
    font-size: 9pt;
    color: var(--mute);
    margin: 0;
    line-height: 1.4;
  }

  /* 푸터 — 학원 정보 */
  .foot {
    margin-top: auto;
    padding-top: 6mm;
    border-top: 2px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-size: 9pt;
    color: var(--mute);
  }
  .foot .left b {
    color: var(--ink);
    font-size: 11pt;
    letter-spacing: -0.01em;
  }
  .foot .right {
    text-align: right;
    font-family: "Menlo", "Consolas", monospace;
  }

  /* 화면에서만 보이는 컨트롤 */
  .controls {
    max-width: 210mm;
    margin: 12px auto;
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 13px;
  }
  .controls input {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid #888;
    border-radius: 4px;
    font: inherit;
  }
  .controls button {
    padding: 8px 14px;
    border: 1px solid #000;
    background: #000;
    color: #fff;
    cursor: pointer;
    border-radius: 4px;
    font-weight: 700;
  }
  .controls label { color: #444; }

  @media print {
    html, body { background: #fff !important; }
    .controls { display: none !important; }
    .page {
      margin: 0 !important;
      box-shadow: none !important;
      page-break-after: always;
    }
    @page { size: A4; margin: 0; }
  }
</style>
</head>
<body>

<div class="controls">
  <label for="urlInput">URL</label>
  <input id="urlInput" type="text" value="https://wawa-learn.pages.dev">
  <button id="renderBtn" type="button">QR 다시 만들기</button>
  <button id="printBtn" type="button">인쇄</button>
</div>

<div class="page">
  <header class="brand">
    <div class="logo"><span class="dot"></span>WAWA <span style="font-weight:400">LEARN</span></div>
    <div class="tag">STUDENT · ACCESS</div>
  </header>

  <section class="headline">
    <h1>여기로 들어와서 <em>공부 시작</em></h1>
    <p>영어 단어 · 수학 증명 · 과제 — 한 곳에서</p>
  </section>

  <section class="qr-card">
    <div class="qr-wrap" id="qr"></div>
    <div class="url-box" id="urlText">wawa-learn.pages.dev</div>
  </section>

  <section class="steps">
    <div class="step">
      <div class="num">1</div>
      <p class="t">QR 스캔</p>
      <p class="d">휴대폰 카메라로<br>QR 코드를 비춥니다</p>
    </div>
    <div class="step">
      <div class="num">2</div>
      <p class="t">로그인</p>
      <p class="d">선생님이 알려준<br>아이디 · 비밀번호 입력</p>
    </div>
    <div class="step">
      <div class="num">3</div>
      <p class="t">학습 시작</p>
      <p class="d">오늘의 단어 · 과제<br>· 증명 풀기</p>
    </div>
  </section>

  <footer class="foot">
    <div class="left">
      <b>WAWA Academy</b><br>
      문의는 담당 선생님께
    </div>
    <div class="right" id="urlFoot">
      https://wawa-learn.pages.dev
    </div>
  </footer>
</div>

<script>
  const $url    = document.getElementById('urlInput');
  const $qr     = document.getElementById('qr');
  const $text   = document.getElementById('urlText');
  const $foot   = document.getElementById('urlFoot');
  const $render = document.getElementById('renderBtn');
  const $print  = document.getElementById('printBtn');

  function render(url) {
    $qr.innerHTML = '';
    QRCode.toCanvas(url, {
      errorCorrectionLevel: 'H',
      margin: 1,
      width: 1024,
      color: { dark: '#000000', light: '#FFFFFF' }
    }, (err, canvas) => {
      if (err) { console.error(err); return; }
      $qr.appendChild(canvas);
    });
    const pretty = url.replace(/^https?:\/\//, '');
    $text.textContent = pretty;
    $foot.textContent = url;
  }

  $render.addEventListener('click', () => render($url.value.trim()));
  $print.addEventListener('click',  () => window.print());
  $url.addEventListener('keydown', e => { if (e.key === 'Enter') render($url.value.trim()); });

  // URL 파라미터로 미리 채우기 가능: ?url=...
  const param = new URLSearchParams(location.search).get('url');
  if (param) $url.value = param;
  render($url.value.trim());
</script>

</body>
</html>
