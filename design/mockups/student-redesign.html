<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management Redesign | WAWA Smart ERP</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    :root {
      --primary: #2d3a8c;
      --primary-hover: #252f73;
      --primary-surface: #eef0f8;
      --bg-primary: #f8f9fb;
      --bg-secondary: #ffffff;
      --text-primary: #1a1e2e;
      --text-secondary: #5e6478;
      --text-tertiary: #9098ad;
      --border-primary: #e3e6ed;
      --success: #10b981;
      --radius-lg: 16px;
      --radius-md: 12px;
      --sp-4: 16px;
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "Pretendard", sans-serif;
      background: var(--bg-primary); color: var(--text-primary);
      height: 100vh; overflow: hidden; display: flex;
    }

    /* Sidebar / Drawer Simulation */
    .detail-panel {
      width: 400px; background: white; border-left: 1px solid var(--border-primary);
      display: flex; flex-direction: column; transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: absolute; right: 0; top: 0; bottom: 0; z-index: 100;
      box-shadow: -10px 0 20px rgba(0,0,0,0.05);
    }
    .detail-panel.open { transform: translateX(0); }

    .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .app-header { background: white; padding: 20px 32px; border-bottom: 1px solid var(--border-primary); flex-shrink: 0; }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .page-title { font-size: 22px; font-weight: 800; margin: 0; }

    .filter-bar { display: flex; gap: 12px; align-items: center; }
    .search-input { flex: 1; max-width: 300px; padding: 10px 16px; border: 1px solid var(--border-primary); border-radius: 8px; font-size: 14px; }
    .select-input { padding: 10px 16px; border: 1px solid var(--border-primary); border-radius: 8px; background: var(--bg-primary); font-size: 14px; }

    /* Student Grid */
    .student-grid { flex: 1; overflow-y: auto; padding: 32px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; align-content: start; }

    .student-card {
      background: white; border: 1px solid var(--border-primary); border-radius: var(--radius-md);
      padding: 20px; cursor: pointer; transition: all 0.2s; position: relative;
    }
    .student-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .student-card.active { border-color: var(--primary); background: var(--primary-surface); }

    .card-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
    .student-name { font-size: 18px; font-weight: 800; }
    .grade-badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: var(--primary); color: white; font-weight: 700; }

    .card-info { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; display: flex; flex-direction: column; gap: 4px; }
    .info-row { display: flex; align-items: center; gap: 6px; }

    .schedule-preview { display: flex; gap: 4px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border-primary); }
    .day-dot { width: 24px; height: 24px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; background: var(--bg-primary); color: var(--text-tertiary); }
    .day-dot.active { background: var(--primary); color: white; }

    /* Detail Panel Content */
    .panel-header { padding: 24px; border-bottom: 1px solid var(--border-primary); display: flex; justify-content: space-between; align-items: center; }
    .panel-body { padding: 24px; overflow-y: auto; flex: 1; }
    .section-title { font-size: 14px; font-weight: 800; margin: 24px 0 12px; color: var(--text-primary); text-transform: uppercase; letter-spacing: 0.05em; }
    
    .schedule-list { display: flex; flex-direction: column; gap: 8px; }
    .schedule-item { background: var(--bg-primary); padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .schedule-time { font-weight: 700; font-size: 14px; }

    .btn { padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 700; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-ghost { background: transparent; color: var(--text-tertiary); }
    
    .toast-container { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
    .toast { background: #1a1e2e; color: white; padding: 12px 24px; border-radius: 99px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow-sm); animation: slide-down 0.3s ease; }
    @keyframes slide-down { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  </style>
</head>
<body>

<div id="toast-root" class="toast-container"></div>

<div class="main-content">
  <header class="app-header">
    <div class="header-top">
      <h1 class="page-title">학생 관리</h1>
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-ghost">내 학생만</button>
        <button class="btn btn-primary" onclick="toast('신규 학생 등록 모달')">+ 학생 추가</button>
      </div>
    </div>
    <div class="filter-bar">
      <input type="text" class="search-input" placeholder="이름, 학교, 연락처 검색...">
      <select class="select-input">
        <option>전체 학년</option>
        <option>중1</option><option>중2</option><option>중3</option>
        <option>고1</option><option>고2</option><option>고3</option>
      </select>
      <select class="select-input">
        <option>재원생</option><option>퇴원생</option>
      </select>
    </div>
  </header>

  <main class="student-grid" id="student-grid"></main>
</div>

<aside class="detail-panel" id="detail-panel">
  <div class="panel-header">
    <h2 id="detail-name" style="margin:0; font-size: 20px; font-weight: 800;">학생 상세</h2>
    <button class="btn btn-ghost" onclick="closeDetail()">닫기</button>
  </div>
  <div class="panel-body">
    <div class="card-info" id="detail-info"></div>
    
    <div class="section-title">수강 시간표</div>
    <div class="schedule-list" id="detail-schedule"></div>
    <button class="btn btn-ghost" style="width:100%; margin-top: 12px; border: 1px dashed var(--border-primary);">+ 시간표 추가</button>

    <div class="section-title">담당 선생님</div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
      <span class="grade-badge" style="background: var(--primary-surface); color: var(--primary);">홍길동 강사</span>
      <span class="grade-badge" style="background: var(--primary-surface); color: var(--primary);">이순신 관리자</span>
    </div>
    
    <div style="margin-top: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
      <button class="btn btn-primary">정보 수정</button>
      <button class="btn" style="background: #fee2e2; color: #ef4444;">비활성화</button>
    </div>
  </div>
</aside>

<script>
  const state = {
    students: [
      { id: 1, name: '강민수', grade: '고2', school: '강남고등학교', contact: '010-1234-5678', guardian: '010-9876-5432', days: ['월', '수', '금'], schedule: [{day:'월', time:'16:30-18:00'}, {day:'수', time:'16:30-18:00'}] },
      { id: 2, name: '이영희', grade: '중3', school: '서초중학교', contact: '010-2222-3333', guardian: '010-4444-5555', days: ['화', '목'], schedule: [{day:'화', time:'17:00-19:00'}] },
      { id: 3, name: '박지민', grade: '고1', school: '양재고등학교', contact: '010-5555-6666', guardian: '010-7777-8888', days: ['월', '화', '목', '토'], schedule: [{day:'월', time:'18:00-20:00'}] },
      { id: 4, name: '최수지', grade: '고3', school: '대치고등학교', contact: '010-0000-0000', guardian: '010-1111-1111', days: ['금', '토', '일'], schedule: [] }
    ],
    selectedId: null
  };

  function toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.getElementById('toast-root').appendChild(el);
    setTimeout(() => el.remove(), 2500);
  }

  function render() {
    const grid = document.getElementById('student-grid');
    grid.innerHTML = state.students.map(s => `
      <div class="student-card ${state.selectedId === s.id ? 'active' : ''}" onclick="openDetail(${s.id})">
        <div class="card-header">
          <span class="student-name">${s.name}</span>
          <span class="grade-badge">${s.grade}</span>
        </div>
        <div class="card-info">
          <div class="info-row">🏫 ${s.school}</div>
          <div class="info-row">📱 ${s.contact}</div>
        </div>
        <div class="schedule-preview">
          ${['월','화','수','목','금','토','일'].map(d => `
            <div class="day-dot ${s.days.includes(d) ? 'active' : ''}">${d}</div>
          `).join('')}
        </div>
      </div>
    `).join('');
  }

  function openDetail(id) {
    state.selectedId = id;
    const s = state.students.find(x => x.id === id);
    document.getElementById('detail-name').textContent = s.name;
    document.getElementById('detail-info').innerHTML = `
      <div class="info-row"><strong>학교:</strong> ${s.school}</div>
      <div class="info-row"><strong>연락처:</strong> ${s.contact}</div>
      <div class="info-row"><strong>보호자:</strong> ${s.guardian}</div>
    `;
    document.getElementById('detail-schedule').innerHTML = s.schedule.length ? s.schedule.map(i => `
      <div class="schedule-item">
        <span class="grade-badge" style="width:30px; text-align:center;">${i.day}</span>
        <span class="schedule-time">${i.time}</span>
        <button class="btn-ghost" style="color:var(--danger)">×</button>
      </div>
    `).join('') : '<p style="color:var(--text-tertiary); font-size:13px;">등록된 시간표가 없습니다.</p>';
    
    document.getElementById('detail-panel').classList.add('open');
    render();
  }

  function closeDetail() {
    state.selectedId = null;
    document.getElementById('detail-panel').classList.remove('open');
    render();
  }

  render();
</script>
</body>
</html>
