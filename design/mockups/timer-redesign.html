<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer Redesign Mockup | WAWA Smart ERP</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    :root {
      --primary: #2d3a8c;
      --primary-hover: #252f73;
      --primary-surface: #eef0f8;
      --accent: #00c4a3;
      --bg-primary: #f8f9fb;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f1f3f6;
      --text-primary: #1a1e2e;
      --text-secondary: #5e6478;
      --text-tertiary: #9098ad;
      --border-primary: #e3e6ed;
      --border-secondary: #eff1f5;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius-sm: 8px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-6: 24px;
      --sp-8: 32px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --font-mono: "SF Mono", "Roboto Mono", monospace;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      height: 100vh;
      overflow: hidden; /* 페이지 전체 스크롤 방지 */
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: var(--sp-6) var(--sp-8);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Page Header */
    .page-header {
      margin-bottom: var(--sp-4);
      flex-shrink: 0;
    }
    .page-title {
      font-size: 24px;
      font-weight: 800;
      margin: 0;
      letter-spacing: -0.02em;
    }
    .page-description {
      color: var(--text-secondary);
      font-size: 14px;
      margin-top: var(--sp-1);
    }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
    }

    .select-input, .text-input {
      padding: 8px 12px;
      border: 1px solid var(--border-primary);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text-primary);
      background: var(--bg-secondary);
    }
    .select-input:focus, .text-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--bg-tertiary); color: var(--text-secondary); }
    .btn-secondary:hover { background: var(--border-primary); }

    /* Layout Columns */
    .timer-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      align-items: stretch;
      flex: 1;
      min-height: 0; /* 중요: 내부 스크롤을 위해 필요 */
      margin-bottom: var(--sp-4);
    }

    @media (max-width: 1024px) {
      .timer-layout { grid-template-columns: 1fr; overflow-y: auto; }
    }

    .timer-column {
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    .column-header {
      padding: 12px 16px;
      background: var(--bg-tertiary);
      border-bottom: 1px solid var(--border-primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 13px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }
    .column-count {
      background: var(--border-primary);
      color: var(--text-primary);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
    }

    .column-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto; /* 독립 스크롤 */
      flex: 1;
    }

    /* Cards */
    .waiting-card {
      padding: 12px;
      border: 1px solid var(--border-secondary);
      border-radius: var(--radius-sm);
      background: var(--bg-primary);
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .waiting-card:hover { border-color: var(--primary); }
    .waiting-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .student-name { font-weight: 700; font-size: 15px; }
    .grade-badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: var(--bg-tertiary); color: var(--text-secondary); }
    .waiting-time { font-size: 12px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }

    .timer-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
      gap: 16px; 
      padding: 16px;
      overflow-y: auto; /* 독립 스크롤 */
      flex: 1;
      align-content: start;
    }

    .timer-card {
      border: 2px solid var(--border-primary); border-radius: 12px; padding: 16px; background: var(--bg-secondary);
      display: flex; flex-direction: column; gap: 12px; transition: border-color 0.3s, box-shadow 0.3s;
    }
    .timer-card--running { border-color: var(--success); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.08); }
    .timer-card--paused { border-color: var(--warning); background: #fffcf5; }
    .timer-card--warning { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1); animation: pulse 2s infinite; }
    .timer-card--overtime { border-color: var(--danger); background: #fff5f5; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0px rgba(239, 68, 68, 0.2); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0px rgba(239, 68, 68, 0); }
    }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .card-identity { display: flex; flex-direction: column; min-width: 0; }
    .card-student-name { font-weight: 800; font-size: 18px; }
    .card-subject { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status-tag { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 99px; text-transform: uppercase; }
    .status-tag--running { background: #dcfce7; color: #166534; }
    .status-tag--paused { background: #fef3c7; color: #92400e; }
    .status-tag--overtime { background: #fee2e2; color: #991b1b; }

    .card-display { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 12px; background: var(--bg-tertiary); border-radius: 10px; }
    .timer-value { font-size: 42px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; color: var(--text-primary); line-height: 1; }
    .timer-card--warning .timer-value, .timer-card--overtime .timer-value { color: var(--danger); }
    .timer-label { font-size: 11px; color: var(--text-tertiary); font-weight: 600; margin-top: 4px; }

    .card-progress { height: 6px; background: var(--border-primary); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width 1s linear; }
    .timer-card--running .progress-fill { background: var(--success); }
    .timer-card--warning .progress-fill { background: var(--danger); }
    .timer-card--overtime .progress-fill { background: var(--danger); width: 100% !important; }

    .card-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-tertiary); font-weight: 500; }
    .card-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
    .card-actions .btn { justify-content: center; padding: 6px 12px; font-size: 13px; }

    /* Modals & Toast */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: white; padding: 24px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
    .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 16px; }
    
    .toast-container { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 2000; pointer-events: none; }
    .toast { background: #1a1e2e; color: white; padding: 12px 20px; border-radius: 99px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2); animation: toast-in 0.3s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: auto; }
    .toast--success { border-left: 4px solid var(--success); }
    .toast--error { border-left: 4px solid var(--danger); }
    .toast--info { border-left: 4px solid var(--primary); }
    @keyframes toast-in { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  </style>
</head>
<body>

<div id="toast-root" class="toast-container"></div>

<div class="container">
  <header class="page-header">
    <h1 class="page-title">실시간 수업 타이머</h1>
    <p class="page-description">학생별 학습 시간을 실시간으로 관리하고 모니터링합니다.</p>
  </header>

  <div class="filter-bar">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 13px; font-weight: 600; color: var(--text-secondary);">요일 선택</span>
      <select class="select-input" id="day-select">
        <option>월요일</option><option>화요일</option><option>수요일</option>
        <option selected>목요일 (오늘)</option><option>금요일</option><option>토요일</option><option>일요일</option>
      </select>
    </div>
    <div style="flex: 1;"></div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 13px; font-weight: 600; color: var(--text-secondary);">정렬</span>
      <select class="select-input" id="sort-select">
        <option value="remaining">남은 시간순</option>
        <option value="name">이름순</option>
        <option value="grade">학년순</option>
      </select>
    </div>
    <button class="btn btn-secondary" onclick="openAdhocModal()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="17" y1="11" x2="23" y2="11"></line></svg>
      임시 학생 추가
    </button>
  </div>

  <div class="timer-layout">
    <div class="timer-column">
      <div class="column-header"><span>대기 중인 학생</span><span class="column-count" id="waiting-count">0</span></div>
      <div class="column-body" id="waiting-list"></div>
    </div>
    <div class="timer-column">
      <div class="column-header"><span>진행 중인 수업</span><span class="column-count" id="active-count">0</span></div>
      <div class="timer-grid" id="timer-grid"></div>
    </div>
  </div>
</div>

<!-- Modals -->
<div class="modal-overlay" id="pause-modal">
  <div class="modal-content">
    <div class="modal-title">일시정지 사유 선택</div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px;">
      <button style="padding: 12px; border: 1px solid var(--border-primary); border-radius: 8px; background: white; cursor: pointer;" onclick="confirmPause('화장실')">화장실</button>
      <button style="padding: 12px; border: 1px solid var(--border-primary); border-radius: 8px; background: white; cursor: pointer;" onclick="confirmPause('휴식')">휴식</button>
      <button style="padding: 12px; border: 1px solid var(--border-primary); border-radius: 8px; background: white; cursor: pointer;" onclick="confirmPause('교사호출')">교사호출</button>
      <button style="padding: 12px; border: 1px solid var(--border-primary); border-radius: 8px; background: white; cursor: pointer;" onclick="confirmPause('기타')">기타</button>
    </div>
    <button class="btn btn-secondary" style="width: 100%;" onclick="closeModal('pause-modal')">취소</button>
  </div>
</div>

<div class="modal-overlay" id="confirm-modal">
  <div class="modal-content">
    <div class="modal-title" id="confirm-title">수업을 종료할까요?</div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 24px;">
      <button class="btn btn-secondary" onclick="closeModal('confirm-modal')">취소</button>
      <button class="btn btn-primary" id="confirm-action-btn">확인</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="adhoc-modal">
  <div class="modal-content">
    <div class="modal-title">임시 학생 추가</div>
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <label style="font-size: 13px; font-weight: 600; color: var(--text-secondary);">이름</label>
        <input type="text" id="adhoc-name" class="text-input" placeholder="학생 이름 입력">
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <div style="display: flex; flex-direction: column; gap: 4px;"><label style="font-size: 13px; font-weight: 600; color: var(--text-secondary);">학년</label><select id="adhoc-grade" class="select-input"><option>중1</option><option>중2</option><option>중3</option><option selected>고1</option><option>고2</option><option>고3</option></select></div>
        <div style="display: flex; flex-direction: column; gap: 4px;"><label style="font-size: 13px; font-weight: 600; color: var(--text-secondary);">시간(분)</label><input type="number" id="adhoc-duration" class="text-input" value="90"></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px;"><label style="font-size: 13px; font-weight: 600; color: var(--text-secondary);">과목/학습 내용</label><input type="text" id="adhoc-subject" class="text-input" placeholder="예: 수학 보충"></div>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 24px;">
      <button class="btn btn-secondary" onclick="closeModal('adhoc-modal')">취소</button>
      <button class="btn btn-primary" onclick="addAdhocStudent()">추가하기</button>
    </div>
  </div>
</div>

<script>
  const toast = {
    show(message, type = 'info') {
      const container = document.getElementById('toast-root');
      const el = document.createElement('div');
      el.className = `toast toast--${type}`;
      el.innerHTML = `<span>${type === 'success' ? '✓' : type === 'error' ? '!' : 'i'}</span> <span>${message}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-20px)';
        el.style.transition = 'all 0.3s';
        setTimeout(() => el.remove(), 500);
      }, 2500);
    },
    success(msg) { this.show(msg, 'success'); },
    error(msg) { this.show(msg, 'error'); },
    info(msg) { this.show(msg, 'info'); }
  };

  let state = {
    waiting: [
      { id: 1, name: '김철수', grade: '고2', subject: '영단어', duration: 90 },
      { id: 2, name: '이영희', grade: '중3', subject: '수학 상', duration: 120 },
      { id: 3, name: '박지민', grade: '고1', subject: '영문법', duration: 90 },
      { id: 4, name: '최수지', grade: '고3', subject: '수능대비', duration: 180 },
      { id: 5, name: '정호석', grade: '중2', subject: '내신보충', duration: 90 },
      { id: 6, name: '민윤기', grade: '고2', subject: '영문법', duration: 120 },
      { id: 7, name: '김남준', grade: '고3', subject: '수능영어', duration: 90 },
      { id: 8, name: '김석진', grade: '고1', subject: '수학 하', duration: 150 }
    ],
    active: [
      { id: 101, name: '강민수', grade: '고2', subject: '수학 상 · 이차방정식', checkInTime: new Date(Date.now() - 45 * 60000), allottedMinutes: 90, addedMinutes: 0, pausedMinutes: 0, status: 'running', pauseHistory: [] },
      { id: 102, name: '임성주', grade: '중2', subject: '영단어 1800', checkInTime: new Date(Date.now() - 86 * 60000), allottedMinutes: 90, addedMinutes: 0, pausedMinutes: 0, status: 'running', pauseHistory: [] }
    ],
    pauseTarget: null, confirmTarget: null
  };

  function formatMMSS(seconds) {
    const absSec = Math.abs(seconds);
    const m = Math.floor(absSec / 60);
    const s = absSec % 60;
    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  }

  function calculateRemaining(session, now) {
    const checkIn = new Date(session.checkInTime);
    const elapsedMs = now.getTime() - checkIn.getTime();
    let totalPausedMs = session.pausedMinutes * 60000;
    if (session.status === 'paused' && session.lastPausedAt) totalPausedMs += (now.getTime() - session.lastPausedAt.getTime());
    const netElapsedSec = Math.floor((elapsedMs - totalPausedMs) / 1000);
    return (session.allottedMinutes + session.addedMinutes) * 60 - netElapsedSec;
  }

  function render() {
    const waitingList = document.getElementById('waiting-list');
    waitingList.innerHTML = state.waiting.map(s => `
      <div class="waiting-card" onclick="checkIn(${s.id})">
        <div class="waiting-top"><span class="student-name">${s.name}</span><span class="grade-badge">${s.grade}</span></div>
        <div class="waiting-time">기본 ${s.duration}분 (${s.subject})</div>
      </div>
    `).join('');
    document.getElementById('waiting-count').textContent = state.waiting.length;

    const timerGrid = document.getElementById('timer-grid');
    const now = new Date();
    const sortBy = document.getElementById('sort-select').value;
    const sortedActive = [...state.active].sort((a, b) => {
      if (sortBy === 'name') return a.name.localeCompare(b.name);
      if (sortBy === 'grade') return b.grade.localeCompare(a.grade);
      return calculateRemaining(a, now) - calculateRemaining(b, now);
    });

    timerGrid.innerHTML = sortedActive.map(s => {
      const remainingSec = calculateRemaining(s, now);
      const isOvertime = remainingSec <= 0;
      const isWarning = remainingSec > 0 && remainingSec <= 600;
      const totalAllotted = (s.allottedMinutes + s.addedMinutes) * 60;
      const progress = Math.min(((totalAllotted - remainingSec) / totalAllotted) * 100, 100);

      let cardClass = 'timer-card';
      if (s.status === 'paused') cardClass += ' timer-card--paused';
      else if (isOvertime) cardClass += ' timer-card--overtime';
      else if (isWarning) cardClass += ' timer-card--warning';
      else cardClass += ' timer-card--running';

      return `
        <div class="${cardClass}">
          <div class="card-top">
            <div class="card-identity"><span class="card-student-name">${s.name}</span><span class="card-subject">${s.subject}</span></div>
            <span class="status-tag ${s.status === 'paused' ? 'status-tag--paused' : (isOvertime ? 'status-tag--overtime' : 'status-tag--running')}">
              ${s.status === 'paused' ? '정지 중' : (isOvertime ? '시간 초과' : '수업 중')}
            </span>
          </div>
          <div class="card-display">
            <span class="timer-value">${isOvertime ? '+' : ''}${formatMMSS(remainingSec)}</span>
            <span class="timer-label">${isOvertime ? '초과 시간' : (s.status === 'paused' ? '정지 중' : '남은 시간')}</span>
          </div>
          <div class="card-progress"><div class="progress-fill" style="width: ${progress}%;"></div></div>
          <div class="card-meta">
            <span>시작 ${s.checkInTime.toLocaleTimeString('ko-KR', {hour12: false, hour:'2-digit', minute:'2-digit'})}</span>
            <span>예정 ${s.allottedMinutes + s.addedMinutes}분</span>
          </div>
          <div class="card-actions">
            ${s.status === 'paused' 
              ? `<button class="btn btn-primary" style="grid-column: span 2;" onclick="resume(${s.id})">▶ 재개하기</button>`
              : `<button class="btn btn-secondary" onclick="openPauseModal(${s.id})">⏸ 정지</button><button class="btn btn-primary" onclick="openConfirmModal(${s.id})">✓ 완료</button>`
            }
          </div>
        </div>
      `;
    }).join('');
    document.getElementById('active-count').textContent = state.active.length;
  }

  function checkIn(studentId) {
    const student = state.waiting.find(s => s.id === studentId);
    if (!student) return;
    state.waiting = state.waiting.filter(s => s.id !== studentId);
    state.active.push({ ...student, id: Date.now(), checkInTime: new Date(), allottedMinutes: student.duration, addedMinutes: 0, pausedMinutes: 0, status: 'running', pauseHistory: [] });
    toast.success(`${student.name} 학생 체크인 완료`);
    render();
  }

  function openPauseModal(sessionId) { state.pauseTarget = sessionId; document.getElementById('pause-modal').style.display = 'flex'; }
  function confirmPause(reason) {
    const session = state.active.find(s => s.id === state.pauseTarget);
    if (session) { session.status = 'paused'; session.lastPausedAt = new Date(); session.pauseHistory.push({ pausedAt: session.lastPausedAt, reason }); toast.info(`${session.name} 수업 정지 (${reason})`); }
    closeModal('pause-modal'); render();
  }

  function resume(sessionId) {
    const session = state.active.find(s => s.id === sessionId);
    if (session && session.status === 'paused') {
      const now = new Date();
      session.pausedMinutes += (now.getTime() - session.lastPausedAt.getTime()) / 60000;
      session.status = 'running'; session.lastPausedAt = null;
      toast.success(`${session.name} 수업 재개`); render();
    }
  }

  function openConfirmModal(sessionId) {
    const session = state.active.find(s => s.id === sessionId);
    if (!session) return;
    state.confirmTarget = sessionId;
    document.getElementById('confirm-modal').style.display = 'flex';
    document.getElementById('confirm-action-btn').onclick = () => {
      state.active = state.active.filter(s => s.id !== state.confirmTarget);
      closeModal('confirm-modal');
      toast.success(`${session.name} 수업 종료 완료`);
      render();
    };
  }

  function openAdhocModal() { document.getElementById('adhoc-name').value = ''; document.getElementById('adhoc-subject').value = ''; document.getElementById('adhoc-modal').style.display = 'flex'; }
  function addAdhocStudent() {
    const name = document.getElementById('adhoc-name').value.trim();
    if (!name) { toast.error('이름을 입력해주세요.'); return; }
    state.waiting.unshift({ id: Date.now(), name, grade: document.getElementById('adhoc-grade').value, subject: document.getElementById('adhoc-subject').value.trim() || '임시 수업', duration: parseInt(document.getElementById('adhoc-duration').value) || 90 });
    toast.success(`${name} 학생이 추가되었습니다.`); closeModal('adhoc-modal'); render();
  }

  function closeModal(id) { document.getElementById(id).style.display = 'none'; }
  setInterval(render, 1000);
  document.getElementById('sort-select').onchange = render;
  document.getElementById('day-select').onchange = render;
  render();
</script>
</body>
</html>
