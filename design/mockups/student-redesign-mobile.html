<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Student Mobile | WAWA Smart ERP</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    :root {
      --primary: #2d3a8c;
      --bg-primary: #f8f9fb;
      --bg-secondary: #ffffff;
      --text-primary: #1a1e2e;
      --text-secondary: #5e6478;
      --text-tertiary: #9098ad;
      --border-primary: #e3e6ed;
      --radius-md: 12px;
      --sp-4: 16px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; font-family: "Pretendard", sans-serif;
      background: var(--bg-primary); color: var(--text-primary);
      height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
    }

    .app-header { background: white; padding: var(--sp-4); border-bottom: 1px solid var(--border-primary); flex-shrink: 0; }
    .page-title { font-size: 18px; font-weight: 800; margin-bottom: 12px; }
    
    .search-bar { display: flex; gap: 8px; }
    .search-input { flex: 1; padding: 10px 14px; border: 1px solid var(--border-primary); border-radius: 10px; font-size: 14px; background: var(--bg-primary); }

    .filter-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; scrollbar-width: none; flex-shrink: 0; }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .tab { padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; background: white; border: 1px solid var(--border-primary); color: var(--text-tertiary); white-space: nowrap; }
    .tab.active { background: var(--primary); color: white; border-color: var(--primary); }

    .student-list { flex: 1; overflow-y: auto; padding: 0 16px 80px; }
    
    .student-card {
      background: white; border-radius: var(--radius-md); border: 1px solid var(--border-primary);
      padding: 16px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 12px;
    }
    
    .card-top { display: flex; justify-content: space-between; align-items: center; }
    .name-group { display: flex; align-items: center; gap: 6px; }
    .name { font-weight: 800; font-size: 16px; }
    .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: var(--bg-primary); color: var(--text-secondary); font-weight: 700; }

    .quick-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .action-btn { 
      padding: 10px; border-radius: 8px; border: 1px solid var(--border-primary); 
      background: white; display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 700; color: var(--text-secondary);
    }
    .action-btn svg { width: 18px; height: 18px; color: var(--primary); }

    /* Bottom Sheet */
    .sheet-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: none; align-items: flex-end; z-index: 1000; }
    .sheet-content { 
      background: white; width: 100%; border-radius: 24px 24px 0 0; padding: 24px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .fab {
      position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; border-radius: 28px;
      background: var(--primary); color: white; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 12px rgba(45, 58, 140, 0.4); border: none;
    }
  </style>
</head>
<body>

<header class="app-header">
  <h1 class="page-title">학생 관리</h1>
  <div class="search-bar">
    <input type="text" class="search-input" placeholder="학생 이름 검색...">
    <button class="action-btn" style="padding: 0 12px; width: auto;">🔍</button>
  </div>
</header>

<nav class="filter-tabs">
  <div class="tab active">전체</div>
  <div class="tab">내 학생</div>
  <div class="tab">중1</div><div class="tab">중2</div><div class="tab">중3</div>
  <div class="tab">고1</div><div class="tab">고2</div><div class="tab">고3</div>
</nav>

<main class="student-list" id="student-list"></main>

<button class="fab" onclick="alert('학생 추가 바텀시트')">+</button>

<div class="sheet-overlay" id="detail-sheet" onclick="this.style.display='none'">
  <div class="sheet-content" onclick="event.stopPropagation()">
    <h2 id="sheet-name" style="margin-bottom: 20px; font-weight: 800;">학생 정보</h2>
    <div style="display: flex; flex-direction: column; gap: 12px; font-size: 14px;" id="sheet-info"></div>
    <div style="margin-top: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
      <button class="action-btn" style="flex-direction: row; font-size: 14px; background: var(--primary); color: white; border: none;">수정하기</button>
      <button class="action-btn" style="flex-direction: row; font-size: 14px;">상세 프로필</button>
    </div>
  </div>
</div>

<script>
  const state = {
    students: [
      { id: 1, name: '강민수', grade: '고2', school: '강남고', contact: '01012345678', guardian: '01098765432' },
      { id: 2, name: '이영희', grade: '중3', school: '서초중', contact: '01022223333', guardian: '01044445555' },
      { id: 3, name: '박지민', grade: '고1', school: '양재고', contact: '01055556666', guardian: '01077778888' },
      { id: 4, name: '최수지', grade: '고3', school: '대치고', contact: '01000000000', guardian: '01011111111' }
    ]
  };

  function render() {
    const list = document.getElementById('student-list');
    list.innerHTML = state.students.map(s => `
      <div class="student-card">
        <div class="card-top" onclick="showSheet(${s.id})">
          <div class="name-group">
            <span class="name">${s.name}</span>
            <span class="badge">${s.grade}</span>
            <span class="badge">${s.school}</span>
          </div>
          <span style="color: var(--text-tertiary);">〉</span>
        </div>
        <div class="quick-actions">
          <a href="tel:${s.contact}" class="action-btn" style="text-decoration: none;">
            <span>📞</span>
            <span>전화</span>
          </a>
          <a href="sms:${s.contact}" class="action-btn" style="text-decoration: none;">
            <span>💬</span>
            <span>문자</span>
          </a>
          <button class="action-btn" onclick="alert('보호자에게 연락')">
            <span>🏠</span>
            <span>보호자</span>
          </button>
        </div>
      </div>
    `).join('');
  }

  function showSheet(id) {
    const s = state.students.find(x => x.id === id);
    document.getElementById('sheet-name').textContent = s.name + ' 학생';
    document.getElementById('sheet-info').innerHTML = `
      <p><strong>학교:</strong> ${s.school}</p>
      <p><strong>학생 연락처:</strong> ${s.contact}</p>
      <p><strong>보호자 연락처:</strong> ${s.guardian}</p>
      <p><strong>상태:</strong> 재원 중</p>
    `;
    document.getElementById('detail-sheet').style.display = 'flex';
  }

  render();
</script>
</body>
</html>
